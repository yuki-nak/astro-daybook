# Every night, settle the weather for days with entries (up to yesterday) and save it to
# src/data/weather.json. The commit triggers a Cloudflare Pages rebuild, which replaces
# "(forecast)" values with observed ones. A saved day is never fetched again.
name: Settle weather

on:
  schedule:
    # 00:30 UTC. Shift it to just after midnight in your site's time zone
    # (e.g. '30 15 * * *' for Asia/Tokyo, '30 5 * * *' for America/New_York).
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Actions are pinned to commits, not tags (tags can be moved)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Fetch and save weather
        run: node tools/update-weather.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add src/data/weather.json
          git commit -m "Weather: settle up to $(date -u -d yesterday +%F)"
          git pull --rebase
          git push
